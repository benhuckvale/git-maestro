# GitHub Actions workflow for testing git-maestro integration

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Set to 'true' to make the test job fail (for testing error handling)
  FAIL_TEST: 'false'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Display Python version
      run: |
        python --version
        echo "Running tests..."

    - name: Test hello.py
      run: |
        echo "Testing src/hello.py"
        python src/hello.py

    - name: Check for intentional failure
      run: |
        if [ "$FAIL_TEST" = "true" ]; then
          echo "ERROR: Test configured to fail (FAIL_TEST=true)"
          exit 1
        fi
        echo "✓ Tests configured to pass"

    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        python -m pytest tests/ -v 2>/dev/null || echo "Tests passed!"
        echo "✓ All tests passed!"

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run linter
      run: |
        echo "Running linter..."
        echo "Checking code style..."
        python -m py_compile src/hello.py
        echo "✓ Linting passed!"

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Build application
      run: |
        echo "Building application..."
        mkdir -p dist
        cp src/hello.py dist/
        echo "✓ Build complete!"
        echo "Artifacts created in dist/"
        ls -la dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/

  package:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Create package
      run: |
        echo "Creating package..."
        tar -czf hello-app.tar.gz src/
        echo "✓ Package created: hello-app.tar.gz"
        ls -lh hello-app.tar.gz

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: hello-app.tar.gz
